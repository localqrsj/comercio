<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6fa">
  <title>Mi Comercio | Tarjeta digital</title>
  <style>
    :root {
      --page: #f3f5f9;
      --surface: #ffffff;
      --ink: #18202f;
      --muted: #697386;
      --line: #e8ebf1;
      --shadow: 0 16px 45px rgba(24, 32, 47, .09);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--page); color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    .page { width: min(100% - 28px, 520px); margin: 28px auto 48px; }
    .card {
      background: var(--surface); border: 1px solid rgba(232,235,241,.9);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    }
    .cover {
      height: 190px; position: relative; background: #dbe4ef center/cover no-repeat;
      background-image: linear-gradient(120deg, rgba(15,23,42,.10), rgba(15,23,42,.30)), var(--cover-image);
    }
    .profile-wrap { display: flex; justify-content: center; margin-top: -57px; position: relative; }
    .profile {
      width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
      border: 5px solid white; background: #e9edf4; box-shadow: 0 5px 18px #18202f20;
    }
    .intro { text-align: center; padding: 10px 26px 22px; }
    .intro h1 { margin: 5px 0 4px; font-size: 27px; letter-spacing: -.7px; }
    .intro p { margin: 0 auto; max-width: 390px; color: var(--muted); font-size: 14px; }
    .location { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; color: #647084; font-size: 13px; }
    .section { padding: 0 22px 23px; }
    .section-title { font-size: 14px; font-weight: 800; margin: 0 0 12px; letter-spacing: .2px; }
    .buttons { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .social {
      min-height: 58px; padding: 12px 14px; border-radius: 15px; color: white;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 14px; font-weight: 750; box-shadow: 0 5px 12px rgba(0,0,0,.10);
      transition: transform .16s ease, filter .16s ease;
    }
    .social:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .social svg { width: 21px; height: 21px; flex: 0 0 auto; }
    .instagram { background: linear-gradient(45deg,#feda75,#fa7e1e 35%,#d62976 68%,#962fbf); }
    .whatsapp { background: #25D366; }
    .facebook { background: #1877F2; }
    .review { background: #202938; }
    .website { background: #0f766e; }
    .catalog { background: #7c3aed; }
    .phone { background: #475569; }
    .info-list { display: grid; gap: 10px; }
    .info-item {
      border: 1px solid var(--line); border-radius: 15px; padding: 13px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: #fff;
    }
    .info-main { min-width: 0; }
    .info-label { display: block; color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 3px; }
    .info-value { font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
    .copy {
      border: 0; border-radius: 10px; padding: 9px 11px; flex: 0 0 auto;
      background: #eef2f7; color: #273449; cursor: pointer; font-size: 12px; font-weight: 800;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .copy:hover { background: #e2e8f0; }
    .copy svg { width: 15px; height: 15px; }
    .hours { white-space: pre-line; }
    .footer { text-align: center; color: #8992a2; font-size: 11px; padding: 18px 10px 4px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
      background: #172033; color: white; padding: 11px 16px; border-radius: 99px;
      font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none;
      transition: .2s ease; box-shadow: 0 8px 24px #0003; z-index: 5;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 380px) {
      .page { width: min(100% - 18px, 520px); margin-top: 9px; }
      .cover { height: 155px; }
      .section { padding-left: 15px; padding-right: 15px; }
      .intro { padding-left: 17px; padding-right: 17px; }
      .social { font-size: 12px; padding: 11px 8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card">
      <div class="cover" id="cover"></div>
      <div class="profile-wrap">
        <img class="profile" id="profile" alt="Imagen de perfil del comercio">
      </div>
      <header class="intro">
        <h1 id="businessName"></h1>
        <p id="description"></p>
        <div class="location" id="location"></div>
      </header>

      <section class="section">
        <h2 class="section-title">Encontranos en nuestras redes</h2>
        <div class="buttons" id="socialButtons"></div>
      </section>

      <section class="section" id="paymentSection">
        <h2 class="section-title">Medios de pago</h2>
        <div class="info-list" id="paymentInfo"></div>
      </section>

      <section class="section" id="wifiSection">
        <h2 class="section-title">WiFi para clientes</h2>
        <div class="info-list" id="wifiInfo"></div>
      </section>

      <section class="section" id="detailsSection">
        <h2 class="section-title">Información del comercio</h2>
        <div class="info-list" id="detailsInfo"></div>
      </section>

    </article>
    <footer class="footer">Creado por <a id="localqrLink" href="https://tudominio.com" target="_blank" rel="noopener noreferrer">LocalQR</a></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite">Copiado</div>

  <script>
    /*
      ==========================================================
      CONFIGURACIÓN DEL COMERCIO
      Editá estos datos para personalizar tu tarjeta digital.
      Dejá "" en los enlaces que no quieras mostrar.
      Las imágenes pueden ser URLs o archivos subidos al proyecto
      (por ejemplo: "img/portada.jpg" y "img/perfil.jpg").
      ==========================================================
    */
    const COMERCIO = {
      nombre: "Mi Comercio",
      descripcion: "Una breve descripción de lo que hacemos o vendemos.",
      ubicacion: "Tu ciudad · Tu dirección",
      portada: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200",
      perfil: "https://images.unsplash.com/photo-1542838132-92c53300491e?w=400",

      redes: {
        instagram: "https://instagram.com/",
        whatsapp: "https://wa.me/5491112345678",
        facebook: "https://facebook.com/",
        opinion: "https://g.page/r/TU-ENLACE-DE-RESEÑA",
        sitioWeb: "https://tusitio.com",
        catalogo: "https://tusitio.com/catalogo",
        telefono: "tel:+5491112345678"
      },

      pagos: [
        { etiqueta: "Alias Mercado Pago", valor: "mi.alias.mp" },
        { etiqueta: "Alias bancario", valor: "mi.alias.banco" }
      ],

      wifi: {
        red: "NombreDeLaRed",
        clave: "TuClaveWiFi123"
      },

      informacion: {
        horarios: "Lunes a viernes: 9:00 a 18:00\nSábados: 9:00 a 13:00\nDomingos: cerrado",
        telefono: "+54 9 11 1234-5678",
        direccion: "Calle 123, Ciudad, Provincia"
      },

    };

    // Reemplazá esta dirección por la web oficial de LocalQR cuando esté publicada.
    const URL_LOCALQR = "https://tudominio.com";

    const ICONS = {
      instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>',
      whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.9L.2 24l6.5-1.7a11.8 11.8 0 0 0 5.4 1.3h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.1-1.2-6.1-3.5-8.3ZM12.1 21.6c-1.7 0-3.3-.5-4.7-1.3l-.3-.2-3.9 1 1-3.8-.2-.4a9.7 9.7 0 1 1 8.1 4.7Zm5.3-7.3c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.2-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.6-1-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.1-1.3-.1-.1-.3-.2-.6-.3Z"/></svg>',
      facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.2v2.3H7.6V13h2.7v8h3.2Z"/></svg>',
      opinion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg>',
      website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>',
      catalog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/></svg>',
      phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h4l2 5-3 2a16 16 0 0 0 6 6l2-3 5 2v4c0 1-1 2-2 2C10 21 3 14 3 5c0-1 1-2 2-2Z"/></svg>'
    };

    const buttonConfig = [
      ["instagram", "Instagram", "instagram"],
      ["whatsapp", "WhatsApp", "whatsapp"],
      ["facebook", "Facebook", "facebook"],
      ["opinion", "Dejanos tu opinión", "review"],
      ["sitioWeb", "Sitio web", "website"],
      ["catalogo", "Catálogo de productos", "catalog"],
      ["telefono", "Llamanos", "phone"]
    ];

    function addButton(key, label, style) {
      const url = COMERCIO.redes[key];
      if (!url) return "";
      return `<a class="social ${style}" href="${safeAttr(url)}" target="_blank" rel="noopener noreferrer">${ICONS[key]}<span>${label}</span></a>`;
    }
    function safeAttr(value) {
      return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }
    function infoItem(label, value, copy = false) {
      if (!value) return "";
      const button = copy
        ? `<button class="copy" type="button" data-copy="${safeAttr(value)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>Copiar</button>`
        : "";
      return `<div class="info-item"><div class="info-main"><span class="info-label">${label}</span><div class="info-value">${String(value).replace(/</g, "&lt;").replace(/\n/g, "<br>")}</div></div>${button}</div>`;
    }

    document.title = `${COMERCIO.nombre} | Tarjeta digital`;
    document.getElementById("businessName").textContent = COMERCIO.nombre;
    document.getElementById("description").textContent = COMERCIO.descripcion;
    document.getElementById("location").textContent = COMERCIO.ubicacion ? "📍 " + COMERCIO.ubicacion : "";
    document.getElementById("cover").style.setProperty("--cover-image", `url("${COMERCIO.portada}")`);
    document.getElementById("profile").src = COMERCIO.perfil;
    document.getElementById("socialButtons").innerHTML = buttonConfig.map(([key,label,style]) => addButton(key,label,style)).join("");
    document.getElementById("paymentInfo").innerHTML = (COMERCIO.pagos || []).map(p => infoItem(p.etiqueta, p.valor, true)).join("");
    document.getElementById("wifiInfo").innerHTML =
      infoItem("Nombre de la red", COMERCIO.wifi.red, true) +
      infoItem("Contraseña", COMERCIO.wifi.clave, true);
    document.getElementById("detailsInfo").innerHTML =
      infoItem("Horarios de atención", COMERCIO.informacion.horarios) +
      infoItem("Teléfono", COMERCIO.informacion.telefono) +
      infoItem("Dirección", COMERCIO.informacion.direccion);
    document.getElementById("localqrLink").href = URL_LOCALQR;

    const toast = document.getElementById("toast");
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;
      const value = button.getAttribute("data-copy");
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const field = document.createElement("textarea");
        field.value = value; document.body.appendChild(field);
        field.select(); document.execCommand("copy"); field.remove();
      }
      toast.textContent = "¡Copiado al portapapeles!";
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    });
  </script>
</body>
</html>
